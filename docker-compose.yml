# Yayın ortamı. Kullanım ve sunucu kurulumu: docs/DEPLOYMENT.md
name: ecommerce-prod

x-db-connection: &db-connection "Server=sqlserver,1433;Database=ECommerce;User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True"

# Container logları diski doldurmasın diye döndürülür.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    restart: unless-stopped
    logging: *logging
    environment:
      ACCEPT_EULA: "Y"
      # Developer sürümü yayında lisanslı değildir; varsayılan ücretsiz Express (veritabanı başına 10 GB).
      MSSQL_PID: ${MSSQL_PID:-Express}
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?MSSQL_SA_PASSWORD .env dosyasında tanımlanmalı}
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q \"SELECT 1\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  migrator:
    build:
      context: .
      target: migrator
    image: ${IMAGE_REGISTRY:-ghcr.io/talipbl}/ecommerce-migrator:${IMAGE_TAG:-latest}
    restart: "no"
    logging: *logging
    depends_on:
      sqlserver:
        condition: service_healthy
    environment:
      ECOMMERCE_CONNECTION: *db-connection

  api:
    build:
      context: .
      target: runtime
    image: ${IMAGE_REGISTRY:-ghcr.io/talipbl}/ecommerce-api:${IMAGE_TAG:-latest}
    restart: unless-stopped
    logging: *logging
    depends_on:
      sqlserver:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      # Caddy'nin X-Forwarded-For/Proto başlıkları okunur; API portu dışarıya kapalı olduğu için güvenli.
      ASPNETCORE_FORWARDEDHEADERS_ENABLED: "true"
      ConnectionStrings__ECommerce: *db-connection
      Jwt__SigningKey: ${JWT_SIGNING_KEY:?JWT_SIGNING_KEY .env dosyasında tanımlanmalı}
      Trendyol__SellerId: ${TRENDYOL_SELLER_ID:?TRENDYOL_SELLER_ID .env dosyasında tanımlanmalı}
      Trendyol__ApiKey: ${TRENDYOL_API_KEY:?TRENDYOL_API_KEY .env dosyasında tanımlanmalı}
      Trendyol__ApiSecret: ${TRENDYOL_API_SECRET:?TRENDYOL_API_SECRET .env dosyasında tanımlanmalı}
      Trendyol__BaseUrl: ${TRENDYOL_BASE_URL:-https://apigw.trendyol.com}
      Seed__Admin__UserName: ${SEED_ADMIN_USERNAME:-}
      Seed__Admin__Password: ${SEED_ADMIN_PASSWORD:-}
      Seed__Admin__Email: ${SEED_ADMIN_EMAIL:-}
      Checkout__BankTransfer__BankName: ${BANK_NAME:-}
      Checkout__BankTransfer__AccountHolder: ${BANK_ACCOUNT_HOLDER:-}
      Checkout__BankTransfer__Iban: ${BANK_IBAN:-}
      Media__PublicBaseUrl: https://${DOMAIN:?DOMAIN .env dosyasında tanımlanmalı}
    volumes:
      - media:/app/media

  caddy:
    image: caddy:2
    restart: unless-stopped
    logging: *logging
    depends_on:
      api:
        condition: service_healthy
    environment:
      DOMAIN: ${DOMAIN:?DOMAIN .env dosyasında tanımlanmalı}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  sqlserver-data:
  media:
  caddy-data:
  caddy-config:
